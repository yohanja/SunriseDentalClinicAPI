<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunrise Dental Clinic - Generate Bill</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-body">

<header class="topbar no-print">
    <a href="dashboard.html"><img src="images/SunriseDental_Logo.png" alt="Sunrise Dental Clinic Logo" class="logo-small"></a>
    <div class="topbar-icons">
        <a href="dashboard.html" class="icon-btn" title="Dashboard"><i class="fa-solid fa-house"></i></a>
        <a href="help.html" class="icon-btn" title="Help"><i class="fa-solid fa-circle-question"></i></a>
        <button id="logoutBtn" class="icon-btn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
</header>

<main class="dashboard-main">
    <div class="form-card no-print">
        <h2><i class="fa-solid fa-file-invoice-dollar"></i> Generate Bill</h2>

        <form id="billForm">
            <div class="input-group">
                <label for="appointmentId">Appointment Number</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="number" id="appointmentId" name="appointmentId" required min="1" placeholder="e.g. 1">
                </div>
            </div>

            <button type="submit"><i class="fa-solid fa-receipt"></i> Generate Bill</button>
        </form>

        <p id="message"></p>
    </div>

    <div id="receipt" class="receipt-card" style="display:none;">
        <div class="receipt-header">
            <img src="images/SunriseDental_Logo.png" alt="Logo" class="receipt-logo">
            <div>
                <h2>Sunrise Dental Clinic</h2>
                <p>Colombo, Sri Lanka</p>
            </div>
        </div>

        <div class="receipt-meta">
            <p><strong>Bill No:</strong> <span id="rBillId"></span></p>
            <p><strong>Appointment No:</strong> <span id="rAppointmentId"></span></p>
        </div>

        <table class="receipt-table">
            <tr><td>Patient Name</td><td id="rPatientName"></td></tr>
            <tr><td>Address</td><td id="rAddress"></td></tr>
            <tr><td>Contact Number</td><td id="rContact"></td></tr>
            <tr><td>Dentist</td><td id="rDentist"></td></tr>
            <tr><td>Treatment</td><td id="rTreatment"></td></tr>
            <tr><td>Appointment Date</td><td id="rDate"></td></tr>
            <tr><td>Appointment Time</td><td id="rTime"></td></tr>
        </table>

        <table class="receipt-table receipt-cost-table">
            <tr><td>Treatment Cost</td><td id="rTreatmentCost"></td></tr>
            <tr><td>Consultation Fee</td><td id="rConsultationFee"></td></tr>
        </table>

        <div class="receipt-total">
            <span>Total Amount</span>
            <span id="rAmount"></span>
        </div>

        <p class="receipt-status">Payment Status: <span id="rStatus"></span></p>

        <button id="markPaidBtn" class="no-print"><i class="fa-solid fa-check-circle"></i> Mark as Paid</button>
        <button id="printBtn" class="no-print" style="display:none;"><i class="fa-solid fa-print"></i> Print Receipt</button>

        <p class="receipt-footer">Thank you for choosing Sunrise Dental Clinic.</p>

<!--        <button id="printBtn" class="no-print"><i class="fa-solid fa-print"></i> Print Receipt</button>-->
    </div>
</main>

<script src="js/bill.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
