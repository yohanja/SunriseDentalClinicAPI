<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sunrise Dental Clinic - My Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-body">

<header class="topbar">
    <a href="dashboard.html"><img src="images/SunriseDental_Logo.png" alt="Sunrise Dental Clinic Logo" class="logo-small"></a>
    <div class="topbar-icons">
        <a href="dashboard.html" class="icon-btn" title="Dashboard"><i class="fa-solid fa-house"></i></a>
        <a href="help.html" class="icon-btn" title="Help"><i class="fa-solid fa-circle-question"></i></a>
        <button id="logoutBtn" class="icon-btn" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
</header>

<main class="dashboard-main">
    <div class="form-card">
        <div class="patient-header">
            <div class="patient-avatar" id="profileAvatar"></div>
            <div>
                <h3 id="profileUsername" style="margin:0; font-size:16px; color:#0F2A47;"></h3>
                <p id="profileRole" style="margin:2px 0 0; font-size:12px; color:#64748B;"></p>
            </div>
        </div>

        <h2 style="font-size:15px;"><i class="fa-solid fa-lock"></i> Change Password</h2>

        <form id="passwordForm">
            <div class="input-group">
                <label for="currentPassword">Current Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="currentPassword" name="currentPassword" required>
                </div>
            </div>

            <div class="input-group">
                <label for="newPassword">New Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" name="newPassword" required minlength="6">
                </div>
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                </div>
            </div>

            <button type="submit"><i class="fa-solid fa-check"></i> Update Password</button>
        </form>

        <p id="message"></p>
    </div>
</main>

<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
